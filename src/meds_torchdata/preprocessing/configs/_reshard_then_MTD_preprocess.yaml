input_dir: ${oc.env:INPUT_DIR}
output_dir: ${oc.env:OUTPUT_DIR}

etl_metadata.pipeline_name: "tensorization"

# Regex over code-metadata `code` strings identifying birth codes; used by `tokenization` to record each
# subject's `birth_time`, from which time-derived age features are computed. Overridable via
# `MTD_preprocess birth_code_regex=...`.
birth_code_regex: "^MEDS_BIRTH(//.*)?$"

stages:
  - reshard_to_split:
      n_subjects_per_shard: 10000
  - fit_normalization:
      aggregations:
        - "code/n_occurrences"
        - "code/n_subjects"
        - "values/n_occurrences"
        - "values/sum"
        - "values/sum_sqd"
    _base_stage: aggregate_code_metadata
  - fit_vocabulary_indices
  - normalization
  - tokenization:
      birth_code_regex: ${birth_code_regex}
  - fit_time_derived_stats
  - tensorization
